<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f5f0" />
    <meta name="description" content="Endereço, código de entrada e o que fazer em cada obra, sem procurar conversa." />
    <!-- Cartão do link compartilhado (WhatsApp, LinkedIn, buscadores).
         A imagem é gerada por `npm run og` a partir de scripts/og.mjs. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Obras" />
    <meta property="og:title" content="Obras — Caderno de Campo" />
    <meta property="og:description" content="Cada obra em um cartão só: endereço, código do portão e tarefas, no bolso, mesmo sem sinal." />
    <meta property="og:url" content="https://obras.derson.cloud/" />
    <meta property="og:image" content="https://obras.derson.cloud/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="O cartão de uma obra com o código do portão em destaque." />
    <meta property="og:locale" content="pt_BR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Obras — Caderno de Campo" />
    <meta name="twitter:description" content="Cada obra em um cartão só: endereço, código do portão e tarefas, no bolso, mesmo sem sinal." />
    <meta name="twitter:image" content="https://obras.derson.cloud/og.png" />
    <title>Obras — Caderno de Campo</title>
    <!-- Configuracao gerada pelo container ao subir. Precisa rodar antes do app. -->
    <script src="/config.js"></script>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- O iPhone ignora o manifesto: precisa destas duas tags para abrir em tela cheia. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Obras" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Contador de visitas próprio (painel-trafego). Só conta no domínio publicado:
         em localhost o s.js não envia nada. -->
    <script src="https://s.derson.cloud/s.js" data-site="988fd2c41c256f9d" defer></script>
  </body>
</html>
