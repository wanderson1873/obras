server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    # Escrito quando o container sobe, a partir das variaveis de ambiente.
    # Nunca pode ficar em cache do navegador, senao trocar a configuracao no
    # painel nao teria efeito.
    location = /config.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    # O service worker precisa ser revalidado a cada visita. Se ele ficar em
    # cache, o app trava numa versão velha e a atualização nunca chega.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    location = /manifest.webmanifest {
        # A imagem do nginx nao conhece a extensao .webmanifest e serviria como
        # application/octet-stream, o que faz o navegador recusar o manifesto e,
        # com ele, a instalacao do app.
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        expires off;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        expires off;
    }

    # Estes arquivos têm hash no nome: quando o conteúdo muda, o nome muda.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # App de página única: qualquer rota cai no index.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
